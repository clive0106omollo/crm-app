# Render Blueprint: creates the web app + database in one go.
databases:
  - name: crm-db
    plan: basic-256mb        # paid plan keeps your data permanently (free DBs expire)
services:
  - type: web
    name: crm-healing-the-roots
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: crm-db, property: connectionString }
      - key: ADMIN_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
